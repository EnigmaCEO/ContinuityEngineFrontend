<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E27D"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7520"/>
    </linearGradient>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon frame (pointy-top) -->
  <polygon points="40,3 73,21.5 73,58.5 40,77 7,58.5 7,21.5"
    fill="#080c12" stroke="url(#g)" stroke-width="2.5"/>
  <!-- Inner hexagon decorative border -->
  <polygon points="40,9 67,25.5 67,54.5 40,71 13,54.5 13,25.5"
    fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.6"/>

  <!-- Star constellation (Sagitta arrow) -->
  <circle cx="40" cy="15.5" r="1.8" fill="#F5E27D"/>
  <circle cx="51" cy="18.5" r="1.2" fill="#F5E27D"/>
  <circle cx="58" cy="14" r="0.9" fill="#F5E27D" opacity="0.85"/>
  <polyline points="40,15.5 51,18.5 58,14"
    fill="none" stroke="#F5E27D" stroke-width="0.6" opacity="0.55"/>

  <!-- Infinity / lemniscate symbol -->
  <path d="M40,44
    C40,36 32,29 24,29
    C16,29 11,36 11,44
    C11,52 16,59 24,59
    C32,59 40,52 40,44
    C40,36 48,29 56,29
    C64,29 69,36 69,44
    C69,52 64,59 56,59
    C48,59 40,52 40,44Z"
    fill="none" stroke="url(#p)" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold gear at bottom -->
  <g transform="translate(40,66)">
    <circle r="3.5" fill="none" stroke="url(#g)" stroke-width="1.8"/>
    <circle r="1.8" fill="url(#g)"/>
    <g stroke="url(#g)" stroke-width="1.8" stroke-linecap="round">
      <line x1="0"    y1="-3.5" x2="0"    y2="-6"/>
      <line x1="2.47" y1="-2.47" x2="4.24" y2="-4.24"/>
      <line x1="3.5"  y1="0"    x2="6"    y2="0"/>
      <line x1="2.47" y1="2.47" x2="4.24" y2="4.24"/>
      <line x1="0"    y1="3.5"  x2="0"    y2="6"/>
      <line x1="-2.47" y1="2.47" x2="-4.24" y2="4.24"/>
      <line x1="-3.5" y1="0"   x2="-6"   y2="0"/>
      <line x1="-2.47" y1="-2.47" x2="-4.24" y2="-4.24"/>
    </g>
  </g>
</svg>
